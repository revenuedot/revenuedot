# Production shape: external Postgres through a Secret, hook Job migrations, Ingress with TLS, S3 archives (keys in the Secret).
image:
  repository: registry.example.com/revenuedot
  tag: ci
env:
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/rds-global-bundle.pem
publicUrl: https://revenuedot.example.com
database:
  existingSecret: revenuedot-db
secrets:
  existingSecret: revenuedot-secrets
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: revenuedot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: revenuedot-tls
      hosts: [revenuedot.example.com]
archives:
  s3:
    bucket: revenuedot-archives
    region: us-east-1
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
