apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "revenuedot.fullname" . }}
  labels:
    {{- include "revenuedot.labels" . | nindent 4 }}
data:
  PORT: "8787"
  NODE_ENV: production
  REVENUEDOT_PUBLIC_URL: {{ include "revenuedot.publicUrl" . | quote }}
  {{- with .Values.apiUrl }}
  REVENUEDOT_API_URL: {{ . | trimSuffix "/" | quote }}
  {{- end }}
  REVENUEDOT_ALLOW_SIGNUP: {{ .Values.allowSignup | toString | quote }}
  REVENUEDOT_BACKGROUND_JOBS: {{ ternary "on" "off" .Values.backgroundJobs | quote }}
  REVENUEDOT_SHUTDOWN_DELAY_MS: {{ .Values.shutdown.delayMs | quote }}
  REVENUEDOT_SHUTDOWN_TIMEOUT_MS: {{ .Values.shutdown.timeoutMs | quote }}
  {{- with .Values.mail.from }}
  REVENUEDOT_MAIL_FROM: {{ . | quote }}
  {{- end }}
  {{- with .Values.mail.replyTo }}
  REVENUEDOT_MAIL_REPLY_TO: {{ . | quote }}
  {{- end }}
  {{- if .Values.archives.s3.bucket }}
  REVENUEDOT_ARCHIVE_S3_BUCKET: {{ .Values.archives.s3.bucket | quote }}
  REVENUEDOT_ARCHIVE_S3_REGION: {{ .Values.archives.s3.region | quote }}
  REVENUEDOT_ARCHIVE_S3_ENDPOINT: {{ .Values.archives.s3.endpoint | quote }}
  REVENUEDOT_ARCHIVE_S3_PREFIX: {{ .Values.archives.s3.prefix | quote }}
  {{- else }}
  # No bucket: archives live in Postgres, never on a pod's disk.
  REVENUEDOT_ARCHIVE_DIR: db
  {{- end }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
