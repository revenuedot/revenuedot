{{- if include "revenuedot.hasChartSecret" . }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "revenuedot.chartSecretName" . }}
  labels:
    {{- include "revenuedot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $s.encryptionKey }}
  REVENUEDOT_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.signingKey }}
  REVENUEDOT_SIGNING_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.smtpUrl }}
  REVENUEDOT_SMTP_URL: {{ . | quote }}
  {{- end }}
  {{- with $s.licenseKey }}
  REVENUEDOT_LICENSE_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.aiGatewayApiKey }}
  AI_GATEWAY_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.archiveS3AccessKeyId }}
  REVENUEDOT_ARCHIVE_S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with $s.archiveS3SecretAccessKey }}
  REVENUEDOT_ARCHIVE_S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.database.url (not .Values.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "revenuedot.fullname" . }}-database
  labels:
    {{- include "revenuedot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
