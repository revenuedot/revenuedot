{{- $replicas := ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int $replicas) 1) }}
# Node drains and cluster upgrades evict at most replicas - minAvailable pods at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "revenuedot.fullname" . }}
  labels:
    {{- include "revenuedot.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "revenuedot.serverSelectorLabels" . | nindent 6 }}
{{- end }}
