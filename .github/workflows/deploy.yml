# Deploys to production on every push to main once CI passes. Docs changes deploy the site from revenuedot/docs.
# Server: migrations, then the Worker for app.revenuedot.app and api.revenuedot.app, then live smoke checks.
# Site: revenuedot.app with the docs. Secrets live in the GitHub "production" environment (master copies in 1Password).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      server: ${{ steps.f.outputs.server }}
      site: ${{ steps.f.outputs.site }}
    steps:
      # Full history: a push can carry several commits, and the diff must cover all of them (with depth 2 only the last
      # commit was seen, so a dashboard change followed by a site-only commit never deployed the server).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "server=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
            echo "site=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Compare with the last deploy that succeeded, not only this push: GitHub keeps one pending run per concurrency
          # group and cancels the older one, so a server change queued behind another deploy was never shipped (PR #24).
          base=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].head_sha' 2>/dev/null || true)
          git cat-file -e "$base^{commit}" 2>/dev/null || base="${{ github.event.before }}"
          echo "Changes since $base"
          files=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "$files" | grep -qE '^(apps/(server|dashboard)|packages|scripts/(deploy-cloud|migrate|smoke-cloud)|pnpm-lock\.yaml|package\.json)' && echo server=true >> "$GITHUB_OUTPUT" || echo server=false >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^(apps/site|design|brand|pnpm-lock\.yaml)' && echo site=true >> "$GITHUB_OUTPUT" || echo site=false >> "$GITHUB_OUTPUT"

  server:
    needs: [ci, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}
      REVENUEDOT_HYPERDRIVE_ID: ${{ vars.REVENUEDOT_HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/deploy-cloud.sh
      - name: Live smoke checks
        run: node scripts/smoke-cloud.mjs https://api.revenuedot.app --read-only --app https://app.revenuedot.app --public-key gXdn2hmqR/TbdtQwK02laE0YgFz0Rtf918LICLrgZhg=

  site:
    needs: [ci, changes, server]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOCS_DIR: ${{ github.workspace }}/docs-repo
      CHECK_WORKSPACE: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: revenuedot/docs
          path: docs-repo
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site run deploy
      - name: Live check
        run: |
          for u in / /docs /pricing /sitemap.xml /llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://revenuedot.app$u"); echo "$u $code"; [ "$code" = 200 ]
          done
      - name: Tell search engines (IndexNow)
        continue-on-error: true
        run: node apps/site/scripts/indexnow.mjs
