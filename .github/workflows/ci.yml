# Type checks and tests on every pull request. On main, deploy.yml runs this first and deploys only if it passes.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b
      - run: pnpm vitest run

  # The same contract and server suites on a real Postgres 16 (PGlite above): driver result shapes, concurrent
  # transactions, deadlocks and timestamp handling only show up here. One database per test file, made by the suite.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --maxWorkers=4 --minWorkers=1
        env:
          REVENUEDOT_TEST_PG_URL: postgres://postgres:ci@localhost:5432/postgres

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The site renders the docs repo at /docs and /blog.
      - uses: actions/checkout@v5
        with:
          repository: revenuedot/docs
          path: docs-repo
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site build
        env:
          DOCS_DIR: ${{ github.workspace }}/docs-repo
      - run: pnpm --filter site check
        env:
          DOCS_DIR: ${{ github.workspace }}/docs-repo
          CHECK_WORKSPACE: "0"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Builds the self-host image and checks it starts and answers health; nothing is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: revenuedot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start with Postgres and check health
        run: |
          docker network create rd
          docker run -d --name db --network rd -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=revenuedot postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name app --network rd -p 8787:8787 -e DATABASE_URL=postgres://postgres:ci@db:5432/revenuedot revenuedot:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8787/ && break; sleep 1; done
          curl -sf http://localhost:8787/ || { docker logs app; exit 1; }
      # The way the Helm chart and the ECS task run it (prd/ha-self-host/PRD.md): migration job first, then replicas as a
      # non-root user on a read-only root filesystem, migrating under the lock; SIGTERM drains and exits 0.
      - name: Run like the Helm chart (migration job, read-only non-root replicas, drain on SIGTERM)
        run: |
          DB=postgres://postgres:ci@db:5432/revenuedot_ha
          docker exec db psql -U postgres -c 'CREATE DATABASE revenuedot_ha'
          RO="--read-only --tmpfs /tmp:rw,size=256m --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges"
          docker run --rm --network rd $RO -e DATABASE_URL=$DB revenuedot:ci node --import tsx src/migrate.node.ts
          for n in 1 2; do docker run -d --name r$n --network rd -p 879$n:8787 $RO -e DATABASE_URL=$DB -e REVENUEDOT_MIGRATE=skip -e REVENUEDOT_ARCHIVE_DIR=db -e REVENUEDOT_SHUTDOWN_DELAY_MS=1000 revenuedot:ci; done
          for n in 1 2; do
            for i in $(seq 1 60); do curl -sf http://localhost:879$n/readyz && break; sleep 1; done
            curl -sf http://localhost:879$n/healthz && curl -sf http://localhost:879$n/readyz || { docker logs r$n; exit 1; }
          done
          docker stop -t 30 r1
          test "$(docker inspect -f '{{.State.ExitCode}}' r1)" = 0 || { docker logs r1; exit 1; }
          docker logs r1 2>&1 | grep -q 'SIGTERM: draining' || { docker logs r1; exit 1; }
          curl -sf http://localhost:8792/readyz

  # Helm chart and Terraform reference setups (deploy/): lint, render and validate. Nothing is applied anywhere.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Helm lint and render every values set in deploy/helm/revenuedot/ci
        working-directory: deploy/helm/revenuedot
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          for f in ci/*.yaml; do
            helm lint --strict . -f "$f"
            helm template rd . -f "$f" > "$RUNNER_TEMP/rendered/$(basename "$f")"
          done
          # Guard rails: no database, two databases, and a hook Job without an existing Secret all refuse to render.
          ! helm template rd . --set publicUrl=https://x.example.com 2>/dev/null
          ! helm template rd . --set publicUrl=https://x.example.com --set database.url=postgres://x --set postgresql.enabled=true 2>/dev/null
          ! helm template rd . --set publicUrl=https://x.example.com --set database.url=postgres://x --set migrations.mode=job 2>/dev/null
      - name: kubeconform (Kubernetes 1.29 to 1.33, strict)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for v in 1.29.0 1.30.0 1.31.0 1.32.0 1.33.0; do ./kubeconform -strict -summary -kubernetes-version "$v" "$RUNNER_TEMP"/rendered/*.yaml; done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: terraform fmt
        run: terraform fmt -check -recursive deploy/terraform
      - name: terraform validate and tflint (aws, gcp)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for m in aws gcp; do
            (cd "deploy/terraform/$m" && terraform init -backend=false -input=false && terraform validate && tflint --init && tflint --format compact)
          done
