# Type checks and tests on every pull request. On main, deploy.yml runs this first (unless the same tree already passed
# on its pull request) and deploys only if it passes.
#
# Speed: only the jobs a change can affect run (an image, a site page or an email's wording does not start the browser
# tests, the Docker build or the real-Postgres suite); the unit tests run in 4 parallel shards, each on a snapshot of a
# migrated database instead of migrating per test; the real-Postgres run covers only the suites that use a database; the
# dashboard's browser tests run in 4 shards; the site build reuses Astro's image cache. On main, deploy.yml runs only
# the jobs that the changes since the last deploy can affect. The last
# job, "CI result", is the one to watch: it fails when any job failed and, for a branch of this repo, records the
# tested tree so the deploy on main can skip running the same tests again.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      full:
        description: Run every job whatever the change. The site job is left to the deploy.
        type: boolean
        default: false
      base:
        description: Pick the jobs from the changes since this commit (deploy.yml on main passes its last deploy). The site job is left to the deploy.
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      pg: ${{ steps.f.outputs.pg }}
      site: ${{ steps.f.outputs.site }}
      docker: ${{ steps.f.outputs.docker }}
      infra: ${{ steps.f.outputs.infra }}
      e2e: ${{ steps.f.outputs.e2e }}
      server: ${{ steps.f.outputs.server }}
    steps:
      - if: inputs.base != ''
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          BASE: ${{ inputs.base }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          everything() { printf 'code=true\npg=true\nsite=%s\ndocker=true\ninfra=true\ne2e=true\nserver=false\n' "$1" | tee -a "$GITHUB_OUTPUT"; exit 0; }
          if [ "$FULL" = "true" ]; then everything false; fi
          if [ -n "$BASE" ]; then
            git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo "Base $BASE not found: running everything."; everything false; }
            files=$(git diff --name-only "$BASE" HEAD); deploy=true
          elif [ -n "$PR" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate -q '.[].filename'); deploy=false
          else
            everything true
          fi
          echo "$files"
          # Files matching $1 and not matching $2.
          has() { echo "$files" | grep -E "$1" | grep -vqE "${2:-^$}" && echo true || echo false; }
          # A change to the CI itself or to the workspace runs everything.
          any=$(has '^(\.github/workflows/(ci|deploy)\.yml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|vitest\.config\.ts|tsconfig(\.base)?\.json)$')
          # Never code: prose, the deploy/ reference setups, and media or site assets anywhere.
          prose='(\.md$|^docs/|^prd/|^deploy/|^LICENSE|^\.github/(CLA|ISSUE_TEMPLATE)|\.(png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|mov|woff2?|ttf|otf|pdf)$|^apps/site/public/)'
          # Type checks and the unit suites: what the root TypeScript project and vitest cover (the site's own pages are
          # checked by the site job).
          code=$(has '^(packages/|apps/(server|dashboard)/|ee/|apps/site/(test|scripts|src/lib)/|scripts/)' "$prose")
          # The suites that use a database, again on real Postgres: data code and server code, not email wording.
          pg=$(has '^(packages/(db|contract|importer)/|apps/server/(src|test)/|ee/)' "$prose|^apps/server/src/mail/")
          site=$(has '^(apps/site/|design/|brand/|packages/core/src/charts/)')
          # The self-host image: what the Dockerfile copies that tests and type checks cannot catch (its build and boot).
          docker=$(has '^(Dockerfile|\.dockerignore|docker-compose\.yml|apps/(server|dashboard)/package\.json|apps/server/src/(entry\.node|migrate\.node|node-dashboard)\.ts|packages/db/)')
          infra=$(has '^deploy/')
          # The dashboard in a browser against the real API: what the dashboard and the API run, not tests or email wording.
          e2e=$(has '^(apps/(server|dashboard)/|packages/|ee/|design/)' "$prose|(^|/)test/|^apps/server/src/mail/")
          # The API routes: the docs repo's drift check compares them with its OpenAPI document (pull requests only).
          server=false; [ "$deploy" = false ] && server=$(has '^(apps/server/src/|ee/server/)' '^apps/server/src/mail/')
          [ "$any" = true ] && { code=true; pg=true; site=true; docker=true; infra=true; e2e=true; }
          [ "$deploy" = true ] && site=false
          printf 'code=%s\npg=%s\nsite=%s\ndocker=%s\ninfra=%s\ne2e=%s\nserver=%s\n' "$code" "$pg" "$site" "$docker" "$infra" "$e2e" "$server" | tee -a "$GITHUB_OUTPUT"

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b
      # The root project leaves out the dashboard, and Vite builds without type checking.
      - run: npx tsc --noEmit -p apps/dashboard

  # Unit, contract and server suites on in-memory PGlite, split by file across parallel jobs.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --shard=${{ matrix.shard }}/4 --maxWorkers=4 --minWorkers=4

  # The suites that use a database (server, contract, db, importer, ee) again on a real Postgres 16 (PGlite above): driver
  # result shapes, concurrent transactions, deadlocks and timestamp handling only show up here. The pure suites
  # (packages/core, the site's and the dashboard's unit tests) would only repeat. One database per test file.
  test-postgres:
    needs: changes
    if: needs.changes.outputs.pg == 'true'
    name: test-postgres (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run apps/server/test packages/contract/test packages/db/test packages/importer/test ee/test --shard=${{ matrix.shard }}/3 --maxWorkers=4 --minWorkers=1
        env:
          REVENUEDOT_TEST_PG_URL: postgres://postgres:ci@localhost:5432/postgres

  # The dashboard's Playwright suite (apps/dashboard/e2e, about 100 tests): the built dashboard in Chromium against the
  # real API on in-memory PGlite with fake stores (e2e/server.ts), so it needs no secrets and reaches no outside host.
  # Split by spec file across parallel jobs, each with its own server. A failed test keeps its trace as an artifact
  # (open it with `npx playwright show-trace <zip>` or at trace.playwright.dev).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "version=$(node -p "require('./apps/dashboard/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Chromium's headless shell only (the suite has no other browser); the cache holds the download, the system
      # libraries come from apt every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter @revenuedot/dashboard exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @revenuedot/dashboard build
      - run: pnpm --filter @revenuedot/dashboard exec playwright test -c e2e/playwright.config.ts --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: apps/dashboard/test-results/
          retention-days: 14
          if-no-files-found: ignore

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The site renders the docs repo at /docs and /blog: the docs branch with this pull request's name when there is
      # one (a site change that goes with a docs change), else docs main.
      - name: Pick the docs branch
        id: docs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/revenuedot/docs "refs/heads/$HEAD_REF" >/dev/null 2>&1; then ref="$HEAD_REF"; else ref=main; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "docs branch: $ref"
      - uses: actions/checkout@v5
        with:
          repository: revenuedot/docs
          ref: ${{ steps.docs.outputs.ref }}
          path: docs-repo
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Astro's optimized images (about 840 AVIF and WebP files, 6.5 minutes to encode from scratch). Entries are keyed
      # by source and settings, so an older cache is safe to start from; the save step keeps the newest.
      - uses: actions/cache@v4
        with:
          path: apps/site/node_modules/.astro
          key: astro-${{ hashFiles('apps/site/src/**', 'apps/site/public/**', 'apps/site/astro.config.mjs') }}
          restore-keys: astro-
      - run: pnpm --filter site build
        env:
          DOCS_DIR: ${{ github.workspace }}/docs-repo
      - run: pnpm --filter site check
        env:
          DOCS_DIR: ${{ github.workspace }}/docs-repo
          CHECK_WORKSPACE: "0"

  # Every API route has an entry in the docs repo's OpenAPI document, and the other way round. Without this the drift
  # showed up only after the merge, as a failed docs deploy (five of them between 2026-10-02 and 2026-10-05). Open the
  # docs pull request from a branch with the same name as this one and this job checks against it; merge this one first.
  docs-drift:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: revenuedot
      - name: Pick the docs branch
        id: docs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/revenuedot/docs "refs/heads/$HEAD_REF" >/dev/null 2>&1; then ref="$HEAD_REF"; else ref=main; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "docs branch: $ref"
      - uses: actions/checkout@v5
        with:
          repository: revenuedot/docs
          ref: ${{ steps.docs.outputs.ref }}
          path: docs
      - uses: actions/setup-node@v5
        with:
          node-version-file: revenuedot/.nvmrc
      - name: Drift between the routes and the OpenAPI document
        working-directory: docs
        env:
          REVENUEDOT_SERVER_DIR: ${{ github.workspace }}/revenuedot
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run build:openapi
          npm run check:drift || { echo "::error::A route changed without the docs. Add it in revenuedot/docs (scripts/openapi/*.mjs, then npm run build) on a branch named ${{ github.head_ref }}."; exit 1; }

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Builds the self-host image and checks it starts and answers health; nothing is pushed. No layer cache: the
      # install layer changes with every commit, and exporting it to the cache took longer than building it.
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          load: true
          tags: revenuedot:ci
      - name: Start with Postgres and check health
        run: |
          docker network create rd
          docker run -d --name db --network rd -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=revenuedot postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name app --network rd -p 8787:8787 -e DATABASE_URL=postgres://postgres:ci@db:5432/revenuedot revenuedot:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8787/ && break; sleep 1; done
          curl -sf http://localhost:8787/ || { docker logs app; exit 1; }
      # The way the Helm chart runs it (prd/ha-self-host/PRD.md): a replica that skips migrating refuses an unmigrated
      # database, the migration job runs, then replicas start as a non-root user on a read-only root filesystem; SIGTERM
      # drains and exits 0.
      - name: Run like the Helm chart (migration job, read-only non-root replicas, drain on SIGTERM)
        run: |
          DB=postgres://postgres:ci@db:5432/revenuedot_ha
          docker exec db psql -U postgres -c 'CREATE DATABASE revenuedot_ha'
          RO="--read-only --tmpfs /tmp:rw,size=256m --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges"
          out=$(docker run --rm --network rd $RO -e DATABASE_URL=$DB -e REVENUEDOT_MIGRATE=skip revenuedot:ci 2>&1) && { echo "$out"; echo "started on an unmigrated database"; exit 1; }
          grep -q 'started without migrating (REVENUEDOT_MIGRATE=skip)' <<<"$out" || { echo "$out"; exit 1; }
          docker run --rm --network rd $RO -e DATABASE_URL=$DB revenuedot:ci node --import tsx src/migrate.node.ts
          for n in 1 2; do docker run -d --name r$n --network rd -p 879$n:8787 $RO -e DATABASE_URL=$DB -e REVENUEDOT_MIGRATE=skip -e REVENUEDOT_ARCHIVE_DIR=db -e REVENUEDOT_SHUTDOWN_DELAY_MS=1000 revenuedot:ci; done
          for n in 1 2; do
            for i in $(seq 1 60); do curl -sf http://localhost:879$n/readyz && break; sleep 1; done
            curl -sf http://localhost:879$n/healthz && curl -sf http://localhost:879$n/readyz || { docker logs r$n; exit 1; }
          done
          docker stop -t 30 r1
          test "$(docker inspect -f '{{.State.ExitCode}}' r1)" = 0 || { docker logs r1; exit 1; }
          docker logs r1 2>&1 | grep -q 'SIGTERM: draining' || { docker logs r1; exit 1; }
          curl -sf http://localhost:8792/readyz

  # Helm chart and Terraform reference setups (deploy/): lint, render and validate. Nothing is applied anywhere.
  deploy:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Helm lint and render every values set in deploy/helm/revenuedot/ci
        working-directory: deploy/helm/revenuedot
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          for f in ci/*.yaml; do
            helm lint --strict . -f "$f"
            helm template rd . -f "$f" > "$RUNNER_TEMP/rendered/$(basename "$f")"
          done
          # Guard rails: each of these must refuse to render, with its own message (a bare `! cmd` would never fail the step).
          refuses() { local want="$1"; shift; if out=$(helm template rd . "$@" 2>&1); then echo "rendered, expected: $want"; exit 1; fi; grep -q "$want" <<<"$out" || { echo "$out"; exit 1; }; }
          ok="--set publicUrl=https://x.example.com"
          refuses "Set image.repository" $ok --set database.url=postgres://x --set image.repository=
          refuses "exactly one database" $ok
          refuses "exactly one database" $ok --set database.url=postgres://x --set postgresql.enabled=true
          refuses "needs database.existingSecret" $ok --set database.url=postgres://x --set migrations.mode=job
          refuses "terminationGracePeriodSeconds" $ok --set database.url=postgres://x --set shutdown.timeoutMs=30000
      - name: kubeconform (Kubernetes 1.29 to 1.33, strict)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for v in 1.29.0 1.30.0 1.31.0 1.32.0 1.33.0; do ./kubeconform -strict -summary -kubernetes-version "$v" "$RUNNER_TEMP"/rendered/*.yaml; done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: terraform fmt
        run: terraform fmt -check -recursive deploy/terraform
      - name: terraform validate and tflint (aws, gcp)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for m in aws gcp; do
            (cd "deploy/terraform/$m" && terraform init -backend=false -input=false && terraform validate && tflint --init && tflint --format compact)
          done

  # One check for the whole run. Skipped jobs (the change could not affect them) count as passed.
  result:
    name: CI result
    needs: [changes, typecheck, test, test-postgres, e2e, site, docs-drift, docker, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
      # The tree GitHub tested (the pull request merged into main as it was then). When main has not moved since, the
      # merge commit has this same tree and deploy.yml skips the tests. Branches of this repo only: a fork could edit
      # this workflow to record a tree it never tested.
      - name: Record the tested tree
        id: tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/${{ github.repository }}/git/commits/${{ github.sha }}" -q .tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "${{ github.sha }}" > tested-commit.txt
      - if: steps.tree.outputs.tree
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-commit.txt
          retention-days: 7
