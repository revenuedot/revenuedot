# Publishes an Android SDK fork to Maven Central under app.revenuedot (prd/sdk-forks/PRD.md, release job) through the
# Central Portal with the vanniktech plugin the forks already use. Uses the `production` environment's Central Portal
# user token and signing key (public key on keyserver.ubuntu.com).
name: Release Maven

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Fork repository (revenuedot/<repo>)
        required: true
        type: choice
        options: [purchases-android, purchases-hybrid-common]
      tag:
        description: Git tag to publish, e.g. 10.23.3-revenuedot
        required: true
      directory:
        description: Gradle project directory inside the repo ("." for the root)
        required: false
        default: "."

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: revenuedot/${{ inputs.repo }}
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key is on a public keyserver
        env:
          KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          fpr=$(printf '%s\n' "$KEY" | gpg --show-keys --with-colons 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')
          [ -n "$fpr" ] || { echo "::error::MAVEN_SIGNING_KEY is not an OpenPGP key gpg can read"; exit 1; }
          echo "Signing key fingerprint: $fpr"
          found=""
          for ks in "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fpr" "https://keys.openpgp.org/vks/v1/by-fingerprint/$fpr"; do
            if curl -fsS "$ks" 2>/dev/null | grep -q "BEGIN PGP PUBLIC KEY BLOCK"; then echo "found on $ks"; found=1; fi
          done
          # Central checks signatures against these keyservers and rejects the deployment when the key is missing.
          # Upload the public half when it is missing (the private key never leaves the runner), then wait for it.
          if [ -z "$found" ]; then
            printf '%s\n' "$KEY" | gpg --batch --import 2>/dev/null
            gpg --armor --export "$fpr" > "$RUNNER_TEMP/public.asc"
            grep -q "BEGIN PGP PUBLIC KEY BLOCK" "$RUNNER_TEMP/public.asc"
            curl -fsS --data-urlencode "keytext@$RUNNER_TEMP/public.asc" https://keyserver.ubuntu.com/pks/add >/dev/null
            echo "uploaded public key $fpr to keyserver.ubuntu.com"
            for i in $(seq 1 30); do
              curl -fsS "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fpr" 2>/dev/null | grep -q "BEGIN PGP PUBLIC KEY BLOCK" && { found=1; break; }
              sleep 10
            done
          fi
          [ -n "$found" ] || { echo "::error::Public key $fpr is on no keyserver Central reads (keyserver.ubuntu.com, keys.openpgp.org)."; exit 1; }

      - name: Publish and release
        working-directory: ${{ inputs.directory }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          TAG: ${{ inputs.tag }}
        # The release version is the tag without its -revenuedot suffix. The forks' gradle.properties say
        # RELEASE_SIGNING_ENABLED=false, and Central rejects unsigned uploads after Gradle reports success.
        run: |
          set -o pipefail
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --info -PVERSION_NAME="${TAG%-revenuedot}" -PRELEASE_SIGNING_ENABLED=true 2>&1 | tee "$RUNNER_TEMP/gradle.log" | grep -vE '^(Resource missing|Found locally available|Cached resource|Skipping|Caching disabled|Up-to-date check|The input changes)'
          grep -oiE 'deployment[^a-z0-9]{1,20}[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/gradle.log" | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | sort -u > "$RUNNER_TEMP/deployments.txt" || true
          echo "Central deployments:"; cat "$RUNNER_TEMP/deployments.txt"

      # Gradle succeeds as soon as the upload is accepted; Central validates afterwards. Wait for the verdict.
      - name: Central accepted the deployment
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/deployments.txt" ] || { echo "::warning::No deployment id in the Gradle log; check https://central.sonatype.com/publishing/deployments"; exit 0; }
          auth="Authorization: Bearer $(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)"
          for id in $(cat "$RUNNER_TEMP/deployments.txt"); do
            for i in $(seq 1 60); do
              body=$(curl -fsS -X POST -H "$auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id")
              state=$(echo "$body" | jq -r .deploymentState)
              echo "$id: $state"
              case "$state" in
                PUBLISHING|PUBLISHED) break ;;
                FAILED) echo "$body" | jq .; echo "::error::Central rejected deployment $id"; exit 1 ;;
              esac
              sleep 30
            done
          done
